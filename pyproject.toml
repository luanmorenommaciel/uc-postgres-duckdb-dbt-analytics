[project]
name = "uc-postgres-duckdb-dbt-analytics"
version = "0.1.0"
description = "Postgres analytical-backbone base: a deterministic seeder and 14-mode chaos generator over a Postgres source, ready for Converge to build the analytical lane on top."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=37",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
